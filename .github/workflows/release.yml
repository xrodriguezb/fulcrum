name: release

# Everything here runs after a change is on main, because it publishes artefacts
# and costs real minutes. The pull request pipeline stays fast by not doing it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: publish images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: deploy/service.Dockerfile
            binary: api
          - name: worker
            dockerfile: deploy/service.Dockerfile
            binary: worker
          - name: web
            dockerfile: deploy/web.Dockerfile
            binary: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            BINARY=${{ matrix.binary }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # An image without a bill of materials is an image nobody can answer
      # questions about when the next advisory lands.
      - name: Generate the software bill of materials
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
          artifact-name: sbom-${{ matrix.name }}.spdx.json
          output-file: sbom-${{ matrix.name }}.spdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json

      - name: Report the image size
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo ""
            echo "digest: ${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

  load:
    name: load test
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start the stack
        run: docker compose -f deploy/compose.yaml up -d --build

      - name: Wait for the stack and seed inventory
        run: |
          set -euo pipefail
          source scripts/lib.sh
          wait_for_stack
          scripts/seed.sh WIDGET-001 5 1050

      - name: Run the load test
        run: make load

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: k6-summary
          path: test/load/summary.json
          if-no-files-found: warn

      - name: Publish the load test numbers
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f test/load/summary.json ]; then exit 0; fi
          {
            echo "### Reservation load test"
            echo ""
            echo "| metric | value |"
            echo "| --- | --- |"
            echo "| created | $(jq -r '.metrics.orders_created.values.count // 0' test/load/summary.json) |"
            echo "| conflicted | $(jq -r '.metrics.orders_conflicted.values.count // 0' test/load/summary.json) |"
            echo "| oversold | $(jq -r '.metrics.oversold.values.count // 0' test/load/summary.json) |"
            echo "| p95 latency | $(jq -r '.metrics.http_req_duration.values["p(95)"] // 0' test/load/summary.json) ms |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose.yaml down -v --remove-orphans
