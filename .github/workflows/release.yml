name: release

# Everything here runs after a change is on main, because it publishes artefacts
# and costs real minutes. The pull request pipeline stays fast by not doing it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: publish images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Provenance attestation is signed with a short lived OIDC token, so the
      # job asks for one. It says which workflow, at which commit, produced this
      # digest, which is the question nobody can answer after the fact.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: deploy/service.Dockerfile
            binary: api
          - name: worker
            dockerfile: deploy/service.Dockerfile
            binary: worker
          - name: web
            dockerfile: deploy/web.Dockerfile
            binary: ''
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            BINARY=${{ matrix.binary }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # An image without a bill of materials is an image nobody can answer
      # questions about when the next advisory lands.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate the software bill of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
          artifact-name: sbom-${{ matrix.name }}.spdx.json
          output-file: sbom-${{ matrix.name }}.spdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json

      - name: Report the image size
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo ""
            echo "digest: ${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

  load:
    name: load test
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Start the stack
        run: docker compose -f deploy/compose.yaml up -d --build

      - name: Wait for the stack and seed inventory
        run: |
          set -euo pipefail
          source scripts/lib.sh
          wait_for_stack
          scripts/seed.sh WIDGET-001 5 1050

      - name: Run the load test
        run: make load

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: k6-summary
          path: test/load/summary.json
          if-no-files-found: warn

      - name: Publish the load test numbers
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f test/load/summary.json ]; then exit 0; fi
          {
            echo "### Reservation load test"
            echo ""
            echo "| metric | value |"
            echo "| --- | --- |"
            echo "| created | $(jq -r '.metrics.orders_created.values.count // 0' test/load/summary.json) |"
            echo "| conflicted | $(jq -r '.metrics.orders_conflicted.values.count // 0' test/load/summary.json) |"
            echo "| oversold | $(jq -r '.metrics.oversold.values.count // 0' test/load/summary.json) |"
            echo "| p95 latency | $(jq -r '.metrics.http_req_duration.values["p(95)"] // 0' test/load/summary.json) ms |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose.yaml down -v --remove-orphans
