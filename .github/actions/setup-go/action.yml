name: Set up Go
description: |
  Installs the Go toolchain declared in go.mod, restores the module and build
  caches, and optionally installs the repository's Go based tools. Four jobs use
  it, so the setup block is defined once rather than copied into each of them.

inputs:
  install-tools:
    description: Install golangci-lint, govulncheck and goimports.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Cache Go tool binaries
      if: inputs.install-tools == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/go/bin
        key: go-tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

    - name: Install Go tools
      if: inputs.install-tools == 'true'
      shell: bash
      run: |
        set -euo pipefail
        install_if_missing() {
          local binary="$1" module="$2"
          if [ ! -x "$(go env GOPATH)/bin/${binary}" ]; then
            go install "${module}"
          fi
        }
        # Versions are the ones pinned in the Makefile, read from it so the
        # pipeline and a developer laptop install exactly the same tools.
        golangci_version="$(grep -E '^GOLANGCI_VERSION' Makefile | awk '{print $3}')"
        gitleaks_version="$(grep -E '^GITLEAKS_VERSION' Makefile | awk '{print $3}')"
        govulncheck_version="$(grep -E '^GOVULNCHECK_VERSION' Makefile | awk '{print $3}')"
        install_if_missing golangci-lint "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${golangci_version}"
        install_if_missing gitleaks "github.com/zricethezav/gitleaks/v8@${gitleaks_version}"
        install_if_missing govulncheck "golang.org/x/vuln/cmd/govulncheck@${govulncheck_version}"
        install_if_missing goimports "golang.org/x/tools/cmd/goimports@latest"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
