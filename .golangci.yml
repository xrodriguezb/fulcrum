version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - wrapcheck
  settings:
    errcheck:
      check-type-assertions: true
    nolintlint:
      # A suppression without a stated reason is a suppression nobody can review.
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      rules:
        - name: exported
        - name: error-strings
        - name: context-as-argument
        - name: indent-error-flow
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
  exclusions:
    generated: lax
    rules:
      # Test helpers legitimately ignore errors on teardown paths and construct
      # fixtures that would be flagged as unwrapped.
      - path: _test\.go
        linters:
          - wrapcheck
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/xrodriguezb/fulcrum
