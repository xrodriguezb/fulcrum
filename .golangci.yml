version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - wrapcheck
  settings:
    errcheck:
      check-type-assertions: true
    nolintlint:
      # A suppression without a stated reason is a suppression nobody can review.
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      rules:
        - name: exported
        - name: error-strings
        - name: context-as-argument
        - name: indent-error-flow
    wrapcheck:
      # Errors that cross a boundary inside this module are already classified by
      # internal/platform/errs, which carries the kind, the stable code and the
      # cause. Wrapping them again would add a prefix and no information, and it
      # would push call sites towards fmt.Errorf where the taxonomy is what the
      # next layer actually reads. Errors from outside the module still have to
      # be wrapped, which is what this linter is for.
      ignore-package-globs:
        - github.com/xrodriguezb/fulcrum/*
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
  exclusions:
    generated: lax
    rules:
      # Test helpers legitimately ignore errors on teardown paths and construct
      # fixtures that would be flagged as unwrapped.
      - path: _test\.go
        linters:
          - wrapcheck
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/xrodriguezb/fulcrum
