server {
    listen 8080;
    server_name _;

    # The console is a single page application: unknown paths are the router's
    # problem, not a 404.
    root /usr/share/nginx/html;
    index index.html;

    # A console that only renders its own assets and talks to its own origin
    # needs nothing else. connect-src includes the origin so the event stream and
    # the api calls work.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;

        # Server sent events must not be buffered, or the console receives
        # nothing until the connection closes and falls back to polling forever.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /healthz {
        proxy_pass http://api:8080/healthz;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
